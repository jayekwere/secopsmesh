name: Kubernetes enforcement lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cilium-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SECMESH_DISPOSABLE_KUBERNETES_LAB: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install locked application dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - name: Real Cilium enforcement and authorized rollback
        run: bash scripts/kubernetes-lab.sh
      - name: Retain real acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: kubernetes-enforcement-evidence, path: reports/, if-no-files-found: error, retention-days: 30}
