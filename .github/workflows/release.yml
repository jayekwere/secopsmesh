name: Publish validated release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact package release tag
        required: true
        default: v0.1.0
permissions: {contents: read}
concurrency:
  group: secopsmesh-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Require exact-commit validation and prepare reviewable assets
        run: python scripts/release.py "$RELEASE_TAG"
      - name: Attest source and measured validation artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/release/*
      - name: Publish the validated release
        run: python scripts/release.py "$RELEASE_TAG" --publish
