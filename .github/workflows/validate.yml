name: Validate SecOpsMesh
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install pip==26.2
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          npm ci --ignore-scripts --prefix frontend
      - name: Formatting, lint and typing
        run: |
          .venv/bin/ruff check src tests scripts
          .venv/bin/ruff format --check src tests scripts
          .venv/bin/mypy src/secopsmesh
      - name: Backend contracts, policy and adversarial tests
        run: .venv/bin/pytest --cov=secopsmesh --cov-report=json:reports/coverage.json --cov-report=xml:reports/coverage.xml --junitxml=reports/backend-junit.xml
      - name: SAST and dependency checks
        run: |
          .venv/bin/bandit -r src -q -f json -o reports/bandit.json
          .venv/bin/pip-audit --skip-editable --strict --format json --output reports/dependency-audit.json
          npm audit --prefix frontend --audit-level=low --json > reports/npm-audit.json
      - name: Build actual dashboard
        run: npm run build --prefix frontend
      - name: Real HTTP demonstrations
        run: .venv/bin/python scripts/demo.py --output reports/demo.json
      - name: Browser acceptance
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload measured reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: application-evidence, path: reports/, if-no-files-found: error, retention-days: 30}
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env: {POSTGRES_USER: mesh_test, POSTGRES_PASSWORD: disposable-ci-only, POSTGRES_DB: mesh_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mesh_test" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mesh_test:disposable-ci-only@127.0.0.1:5432/mesh_test
      SECMESH_ALLOW_TEST_DB_RESET: disposable-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pytest -q --junitxml=reports/postgres-junit.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: postgres-evidence, path: reports/, if-no-files-found: error}
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/python scripts/compose-config.py
          docker compose config --quiet
          docker compose build
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint python secopsmesh:local -c 'import secopsmesh.api; print("nonroot runtime import passed")'
          docker compose up -d --wait --wait-timeout 180
          .venv/bin/secopsmesh seed --tokens .runtime/compose/tokens.json
          .venv/bin/python scripts/container-acceptance.py
      - name: Container, infrastructure, secret scanning and SBOM
        run: bash scripts/security-checks.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: container-security-evidence, path: reports/, if-no-files-found: error}
      - name: Remove only the disposable stack
        if: always()
        run: docker compose down -v --remove-orphans
